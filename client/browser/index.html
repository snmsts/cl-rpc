<!--
  CL-RPC Browser Client (client/browser/index.html)

  A self-contained single-file browser REPL for the CL-RPC server.
  No build step required — just open this file or serve it via the server's
  static-file option:

      (cl-rpc:start-server :port 7654 :static-dir "/path/to/client/browser")

  Then navigate to http://localhost:7654 in a browser.

  Features:
  - CodeMirror editor with Lisp syntax highlighting and paredit-style bindings
  - Streaming stdout/stderr/trace output via WebSocket notifications
  - Inline debugger: shows restarts and backtrace, supports restart invocation
  - Tab completion via the completions RPC method
  - Macroexpand (Alt+M) and describe (Alt+D) keyboard shortcuts
  - Automatic reconnect on disconnect

  Protocol: connects to ws://<same host and port> and speaks JSON-RPC 2.0.
  See docs/protocol.md for the full protocol specification.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CL-RPC REPL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 14px;
    }

    /* output area */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .output-line {
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .output-input  { color: #569cd6; }
    .output-value  { color: #d4d4d4; }
    .output-stdout { color: #9cdcfe; }
    .output-stderr { color: #f48771; }
    .output-error  { color: #f48771; }
    .output-system { color: #608b4e; font-style: italic; }
    .output-trace  { color: #c586c0; }

    /* debugger panel */
    #debugger-panel {
      display: none;
      border-top: 2px solid #dcdcaa;
      background: #2d2d2d;
      padding: 8px 12px;
      flex-shrink: 0;
    }
    #debugger-panel.active { display: block; }
    #debugger-condition {
      color: #dcdcaa;
      margin-bottom: 6px;
      font-weight: bold;
    }
    #debugger-restarts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .restart-btn {
      background: #3c3c3c;
      border: 1px solid #555;
      color: #d4d4d4;
      padding: 2px 10px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    .restart-btn:hover { background: #505050; border-color: #dcdcaa; }
    #debugger-frames-toggle {
      color: #608b4e;
      cursor: pointer;
      font-size: 12px;
      user-select: none;
    }
    #debugger-frames {
      display: none;
      margin-top: 6px;
      color: #888;
      font-size: 12px;
      max-height: 120px;
      overflow-y: auto;
    }
    #debugger-frames.open { display: block; }

    /* status bar */
    #statusbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 12px;
      background: #007acc;
      color: #fff;
      font-size: 12px;
      flex-shrink: 0;
    }
    #statusbar.in-debug { background: #8b6914; }
    #status-pkg  { font-weight: bold; }
    #status-conn { opacity: 0.8; }
    #status-conn.disconnected { color: #f48771; }

    /* input area */
    #input-area {
      display: flex;
      align-items: flex-start;
      border-top: 1px solid #3c3c3c;
      flex-shrink: 0;
      max-height: 40vh;
      overflow-y: auto;
    }
    #prompt {
      padding: 6px 4px 6px 12px;
      color: #569cd6;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.5;
    }
    #editor { flex: 1; min-height: 28px; }

    .cm-editor { background: transparent !important; height: 100%; }
    .cm-editor.cm-focused { outline: none; }
    .cm-scroller { overflow: visible; }
    .cm-content { padding: 6px 4px; color: #d4d4d4; }
    .cm-line { line-height: 1.5; }
    .cm-cursor { border-left-color: #d4d4d4; }
    .cm-matchingBracket { background: #3a3a3a; outline: 1px solid #888; }

    /* completion popup */
    .cm-tooltip-autocomplete {
      background: #252526 !important;
      border: 1px solid #454545 !important;
    }
    .cm-completionLabel { color: #d4d4d4; }
    .cm-completionDetail { color: #888; font-size: 12px; }
    .cm-tooltip-autocomplete li[aria-selected] {
      background: #094771 !important;
    }
  </style>
</head>
<body>
  <div id="output"></div>

  <div id="debugger-panel">
    <div id="debugger-condition"></div>
    <div id="debugger-restarts"></div>
    <span id="debugger-frames-toggle">▶ backtrace</span>
    <div id="debugger-frames"></div>
  </div>

  <div id="statusbar">
    <span id="status-pkg">cl-user</span>
    <span id="status-conn">connecting...</span>
    <span id="status-impl"></span>
    <span id="status-debug"></span>
  </div>

  <div id="input-area">
    <span id="prompt">cl-user&gt; </span>
    <div id="editor"></div>
  </div>

  <script type="module">
    import { EditorView, keymap,
             highlightActiveLine,
             drawSelection }               from 'https://esm.sh/@codemirror/view@6'
    import { EditorState }                 from 'https://esm.sh/@codemirror/state@6'
    import { history, defaultKeymap,
             historyKeymap, indentWithTab } from 'https://esm.sh/@codemirror/commands@6'
    import { bracketMatching, StreamLanguage,
             syntaxHighlighting,
             defaultHighlightStyle }       from 'https://esm.sh/@codemirror/language@6'
    import { autocompletion,
             completionKeymap }            from 'https://esm.sh/@codemirror/autocomplete@6'
    import { commonLisp }                  from 'https://esm.sh/@codemirror/legacy-modes@6/mode/commonlisp'

    // -----------------------------------------------------------------------
    // State
    // -----------------------------------------------------------------------
    let ws        = null
    let nextId    = 1
    let pending   = new Map()
    let pkg       = 'cl-user'
    let connected = false
    let debugLevel = 0

    // -----------------------------------------------------------------------
    // Output
    // -----------------------------------------------------------------------
    const output = document.getElementById('output')

    function appendOutput(text, cls) {
      const line = document.createElement('div')
      line.className = 'output-line ' + cls
      line.textContent = text
      output.appendChild(line)
      output.scrollTop = output.scrollHeight
    }

    function setPackage(name) {
      pkg = name.toLowerCase()
      document.getElementById('status-pkg').textContent = pkg
      document.getElementById('prompt').textContent = pkg + '> '
    }

    function setConnected(ok) {
      connected = ok
      const el = document.getElementById('status-conn')
      el.textContent = ok ? 'connected' : 'disconnected'
      el.className = ok ? '' : 'disconnected'
    }

    // -----------------------------------------------------------------------
    // Debugger UI
    // -----------------------------------------------------------------------
    const debugPanel     = document.getElementById('debugger-panel')
    const debugCondition = document.getElementById('debugger-condition')
    const debugRestarts  = document.getElementById('debugger-restarts')
    const debugFrames    = document.getElementById('debugger-frames')
    const framesToggle   = document.getElementById('debugger-frames-toggle')
    const statusbar      = document.getElementById('statusbar')
    const statusDebug    = document.getElementById('status-debug')

    const VALUE_RESTARTS = new Set(['USE-VALUE', 'STORE-VALUE'])

    framesToggle.addEventListener('click', () => {
      const open = debugFrames.classList.toggle('open')
      framesToggle.textContent = (open ? '▼' : '▶') + ' backtrace'
    })

    function showDebugger(params) {
      debugLevel = params.level
      debugCondition.textContent = `[level ${params.level}] ${params.condition}`

      debugRestarts.innerHTML = ''
      params.restarts.forEach(r => {
        const btn = document.createElement('button')
        btn.className = 'restart-btn'
        btn.textContent = `${r.index}: [${r.name}] ${r.description}`
        btn.onclick = () => {
          const rpcParams = { level: params.level, index: r.index }
          if (VALUE_RESTARTS.has(r.name.toUpperCase())) {
            const val = window.prompt(`Value for ${r.name}:`)
            if (val === null) return   // cancelled
            if (val !== '') rpcParams.value = val
          }
          rpc('invoke-restart', rpcParams)
        }
        debugRestarts.appendChild(btn)
      })

      debugFrames.innerHTML = ''
      debugFrames.classList.remove('open')
      framesToggle.textContent = '▶ backtrace'
      if (params.frames && params.frames.length > 0) {
        params.frames.forEach(f => {
          const div = document.createElement('div')
          div.textContent = `${f.index}: ${f.description}`
          debugFrames.appendChild(div)
        })
        framesToggle.style.display = ''
      } else {
        framesToggle.style.display = 'none'
      }

      debugPanel.classList.add('active')
      statusbar.classList.add('in-debug')
      statusDebug.textContent = `debugger [level ${params.level}]`
    }

    function hideDebugger() {
      debugLevel = 0
      debugPanel.classList.remove('active')
      statusbar.classList.remove('in-debug')
      statusDebug.textContent = ''
    }

    // -----------------------------------------------------------------------
    // WebSocket / JSON-RPC
    // -----------------------------------------------------------------------
    function connect() {
      const url = 'ws://' + location.host
      ws = new WebSocket(url)

      ws.onopen = () => {
        setConnected(true)
        appendOutput('; Connected to ' + url, 'output-system')
        editor.focus()
      }

      ws.onclose = () => {
        setConnected(false)
        appendOutput('; Disconnected. Reconnecting in 3s...', 'output-system')
        pending.forEach(cb => cb.reject(new Error('Disconnected')))
        pending.clear()
        setTimeout(connect, 3000)
      }

      ws.onerror = () => {
        setConnected(false)
        pending.forEach(cb => cb.reject(new Error('Connection error')))
        pending.clear()
      }

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data)
        if (msg.method && !msg.id) { handleNotification(msg); return }
        const cb = pending.get(msg.id)
        if (cb) {
          pending.delete(msg.id)
          if (msg.error) cb.reject(msg.error)
          else           cb.resolve(msg.result)
        }
      }
    }

    function rpc(method, params) {
      return new Promise((resolve, reject) => {
        const id = nextId++
        pending.set(id, { resolve, reject })
        ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }))
      })
    }

    function handleNotification(msg) {
      switch (msg.method) {
        case 'welcome': {
          const { implementation, 'implementation-version': version } = msg.params
          document.getElementById('status-impl').textContent =
            implementation && version ? `${implementation} ${version}` : ''
          break
        }
        case 'output': {
          const { text, target } = msg.params
          const cls = target === 'stderr' ? 'output-stderr'
                    : target === 'trace'  ? 'output-trace'
                    :                       'output-stdout'
          const trimmed = text.replace(/\n$/, '')
          if (trimmed) appendOutput(trimmed, cls)
          break
        }
        case 'debug':
          appendOutput(`; Debugger: ${msg.params.condition}`, 'output-system')
          showDebugger(msg.params)
          break
        case 'debug-return':
          hideDebugger()
          appendOutput('; Debugger exited.', 'output-system')
          break
      }
    }

    // -----------------------------------------------------------------------
    // Eval
    // -----------------------------------------------------------------------
    async function evalCode(code) {
      if (!connected) { appendOutput('; Not connected', 'output-error'); return }
      code = code.trim()
      if (!code) return

      appendOutput(pkg + '> ' + code, 'output-input')

      try {
        const result = await rpc('eval', { code, package: pkg })
        if (result.package && result.package.toLowerCase() !== pkg) setPackage(result.package)
        result.values.forEach(v => appendOutput(v, 'output-value'))
      } catch (err) {
        appendOutput('; Error: ' + (err.message || JSON.stringify(err)), 'output-error')
      }
    }

    // -----------------------------------------------------------------------
    // Macroexpand
    // -----------------------------------------------------------------------
    function macroexpandEditor(view) {
      if (!connected) { appendOutput('; Not connected', 'output-error'); return true }
      const code = view.state.doc.toString().trim()
      if (!code) return true
      rpc('macroexpand', { code, package: pkg }).then(result => {
        if (result && result.expansion) {
          appendOutput('; macroexpand: ' + code, 'output-system')
          appendOutput(result.expansion, 'output-value')
        }
      }).catch(err => {
        appendOutput('; Error: ' + (err.message || JSON.stringify(err)), 'output-error')
      })
      return true
    }

    // -----------------------------------------------------------------------
    // Describe
    // -----------------------------------------------------------------------
    function symbolAtCursor(view) {
      const state = view.state
      const pos   = state.selection.main.head
      const line  = state.doc.lineAt(pos)
      const text  = line.text
      const col   = pos - line.from
      const re    = /[a-zA-Z0-9\-_*+/<>=!&%?:]/
      let start = col, end = col
      while (start > 0 && re.test(text[start - 1])) start--
      while (end < text.length && re.test(text[end])) end++
      return text.slice(start, end)
    }

    function describeAtCursor(view) {
      if (!connected) { appendOutput('; Not connected', 'output-error'); return true }
      const symbol = symbolAtCursor(view)
      if (!symbol) return true
      rpc('describe', { symbol, package: pkg }).then(result => {
        if (!result) return
        appendOutput(`; ${result.package}:${result.name}  [${result.type}]`, 'output-system')
        if (result.args)      appendOutput(`; Args: ${result.args}`, 'output-system')
        if (result.docstring) appendOutput(result.docstring, 'output-value')
      }).catch(err => {
        appendOutput('; Error: ' + (err.message || JSON.stringify(err)), 'output-error')
      })
      return true
    }

    // -----------------------------------------------------------------------
    // Completion
    // -----------------------------------------------------------------------
    // Split "pkg:sym" / "pkg::sym" into components.
    // returns { prefix, package, internal, head }
    // head: package qualifier prefix to prepend to each completion label
    function splitPrefix(word) {
      const colon = word.indexOf(':')
      if (colon === -1) {
        return { prefix: word, pkg: null, internal: false, head: '' }
      }
      if (word[colon + 1] === ':') {
        return {
          prefix: word.slice(colon + 2),
          pkg: word.slice(0, colon),
          internal: true,
          head: word.slice(0, colon + 2),
        }
      }
      return {
        prefix: word.slice(colon + 1),
        pkg: word.slice(0, colon),
        internal: false,
        head: word.slice(0, colon + 1),
      }
    }

    async function lispCompletionSource(context) {
      const word = context.matchBefore(/[^\s\t\n()\[\]{}'"`,;\\]+/)
      if (!word || (word.from === word.to && !context.explicit)) return null
      if (!connected) return null
      try {
        const { prefix, pkg: qualPkg, internal, head } = splitPrefix(word.text)
        const targetPkg = qualPkg || pkg
        const useInternal = qualPkg ? internal : true
        const result = await rpc('completions', {
          prefix,
          package: targetPkg,
          internal: useInternal,
          limit: 100,
        })
        if (!result || !result.candidates || result.candidates.length === 0) return null
        const options = result.candidates.map(c => ({
          label: head + c.label,
          detail: c.kind,
          type: 'variable',
        }))
        return { from: word.from, options }
      } catch (_) {
        return null
      }
    }

    // -----------------------------------------------------------------------
    // CodeMirror
    // -----------------------------------------------------------------------
    function parenDepth(s) {
      let depth = 0, inStr = false, esc = false
      for (const ch of s) {
        if (esc) { esc = false; continue }
        if (ch === '\\' && inStr) { esc = true; continue }
        if (ch === '"') { inStr = !inStr; continue }
        if (inStr) continue
        if (ch === '(') depth++
        if (ch === ')') depth--
      }
      return depth
    }

    function submitEditor(view) {
      const code = view.state.doc.toString()
      evalCode(code)
      view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: '' } })
      return true
    }

    const evalKeymap = keymap.of([
      { key: 'Ctrl-Enter',       run: submitEditor },
      { key: 'Mod-Enter',        run: submitEditor },
      { key: 'Ctrl-Shift-m',     run: macroexpandEditor },
      { key: 'Ctrl-Shift-d',     run: describeAtCursor },
      {
        key: 'Shift-Enter',
        run(view) {
          const code = view.state.doc.toString()
          if (parenDepth(code) === 0 && code.trim()) return submitEditor(view)
          return false
        }
      }
    ])

    const editor = new EditorView({
      extensions: [
        evalKeymap,
        history(),
        drawSelection(),
        highlightActiveLine(),
        bracketMatching(),
        syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
        keymap.of([...defaultKeymap, ...historyKeymap, ...completionKeymap, indentWithTab]),
        StreamLanguage.define(commonLisp),
        autocompletion({ override: [lispCompletionSource] }),
        EditorView.theme({
          '&': { background: 'transparent' },
          '.cm-gutters': { display: 'none' },
        }),
      ],
      parent: document.getElementById('editor'),
    })

    connect()
    editor.focus()
  </script>
</body>
</html>
